<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#64748b"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .box { rx: 10; ry: 10; stroke-width: 2; }
      .label { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .small { font-size: 11px; fill: #475569; }
      .group-title { font-size: 12px; font-weight: 700; fill: #334155; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line-dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-dash); }
    </style>
  </defs>

  <text x="600" y="34" text-anchor="middle" class="title">Kafka ’ Spark ’ Delta Lake ’ Dagster ’ Snowflake</text>
  <text x="600" y="56" text-anchor="middle" class="subtitle">Real-time stock trade streaming pipeline · Janvi Chitroda</text>

  <!-- Data Sources -->
  <rect x="40" y="90" width="200" height="120" fill="#ecfdf5" stroke="#10b981" class="box"/>
  <text x="140" y="112" text-anchor="middle" class="group-title">DATA SOURCES</text>
  <rect x="60" y="128" width="160" height="32" fill="#ffffff" stroke="#34d399" class="box"/>
  <text x="140" y="148" text-anchor="middle" class="label">Finnhub Live</text>
  <rect x="60" y="168" width="160" height="32" fill="#ffffff" stroke="#34d399" class="box"/>
  <text x="140" y="188" text-anchor="middle" class="label">Trade Simulator</text>

  <!-- Kafka -->
  <rect x="300" y="110" width="200" height="80" fill="#eff6ff" stroke="#3b82f6" class="box"/>
  <text x="400" y="132" text-anchor="middle" class="group-title">MESSAGE BROKER</text>
  <text x="400" y="156" text-anchor="middle" class="label">Kafka / Redpanda</text>
  <text x="400" y="174" text-anchor="middle" class="small">stock_trades · 3 partitions</text>

  <!-- Spark -->
  <rect x="560" y="90" width="220" height="120" fill="#fff7ed" stroke="#f97316" class="box"/>
  <text x="670" y="112" text-anchor="middle" class="group-title">STREAM PROCESSING</text>
  <text x="670" y="140" text-anchor="middle" class="label">Spark Structured Streaming</text>
  <text x="670" y="160" text-anchor="middle" class="small">4 queries · watermark 10s</text>
  <text x="670" y="178" text-anchor="middle" class="small">10s micro-batch trigger</text>

  <!-- Delta Lake -->
  <rect x="840" y="70" width="320" height="160" fill="#f5f3ff" stroke="#8b5cf6" class="box"/>
  <text x="1000" y="92" text-anchor="middle" class="group-title">DELTA LAKE</text>
  <rect x="860" y="108" width="130" height="36" fill="#ffffff" stroke="#a78bfa" class="box"/>
  <text x="925" y="130" text-anchor="middle" class="label">raw_trades</text>
  <rect x="1010" y="108" width="130" height="36" fill="#ffffff" stroke="#a78bfa" class="box"/>
  <text x="1075" y="130" text-anchor="middle" class="label">vwap_1min</text>
  <rect x="860" y="156" width="130" height="36" fill="#ffffff" stroke="#a78bfa" class="box"/>
  <text x="925" y="178" text-anchor="middle" class="label">vwap_5min</text>
  <rect x="1010" y="156" width="130" height="36" fill="#ffffff" stroke="#a78bfa" class="box"/>
  <text x="1075" y="178" text-anchor="middle" class="label">anomaly_alerts</text>

  <!-- Quality -->
  <rect x="840" y="280" width="200" height="70" fill="#fef2f2" stroke="#ef4444" class="box"/>
  <text x="940" y="302" text-anchor="middle" class="group-title">QUALITY GATE</text>
  <text x="940" y="328" text-anchor="middle" class="label">7 Data Quality Checks</text>

  <!-- Snowflake -->
  <rect x="1080" y="280" width="80" height="70" fill="#ecfeff" stroke="#06b6d4" class="box"/>
  <text x="1120" y="304" text-anchor="middle" class="group-title">WAREHOUSE</text>
  <text x="1120" y="326" text-anchor="middle" class="small">Snowflake</text>

  <!-- Dagster -->
  <rect x="560" y="280" width="220" height="70" fill="#fdf4ff" stroke="#d946ef" class="box"/>
  <text x="670" y="302" text-anchor="middle" class="group-title">ORCHESTRATION</text>
  <text x="670" y="328" text-anchor="middle" class="label">Dagster · 5 assets · daily 5PM</text>

  <!-- Monitoring -->
  <rect x="40" y="280" width="460" height="120" fill="#f8fafc" stroke="#64748b" class="box"/>
  <text x="270" y="302" text-anchor="middle" class="group-title">MONITORING &amp; VALIDATION</text>
  <rect x="60" y="320" width="130" height="36" fill="#ffffff" stroke="#94a3b8" class="box"/>
  <text x="125" y="342" text-anchor="middle" class="label">Live Dashboard</text>
  <rect x="210" y="320" width="150" height="36" fill="#ffffff" stroke="#94a3b8" class="box"/>
  <text x="285" y="342" text-anchor="middle" class="label">Batch Reconciliation</text>
  <rect x="380" y="320" width="100" height="36" fill="#ffffff" stroke="#94a3b8" class="box"/>
  <text x="430" y="342" text-anchor="middle" class="label">Recovery Test</text>

  <!-- Arrows main flow -->
  <path d="M240 150 L300 150" class="line"/>
  <path d="M500 150 L560 150" class="line"/>
  <path d="M780 150 L840 150" class="line"/>
  <path d="M1075 206 L1075 250 L940 250 L940 280" class="line"/>
  <path d="M1040 280 L1040 315 L840 315" class="line"/>

  <!-- Monitoring arrows -->
  <path d="M925 206 L925 240 L125 240 L125 320" class="line"/>
  <path d="M1075 206 L1075 260 L285 260 L285 320" class="line"/>

  <!-- Dagster dashed -->
  <path d="M670 280 L670 210" class="line-dash"/>
  <path d="M700 315 L820 315" class="line-dash"/>
  <path d="M780 315 L1080 315" class="line-dash"/>

  <text x="690" y="248" class="small">orchestrates</text>
  <text x="760" y="308" class="small">orchestrates</text>
  <text x="920" y="308" class="small">orchestrates</text>

  <!-- Legend -->
  <rect x="40" y="440" width="1120" height="250" fill="#ffffff" stroke="#cbd5e1" class="box"/>
  <text x="600" y="468" text-anchor="middle" class="group-title">PIPELINE MODES</text>

  <rect x="70" y="490" width="320" height="80" fill="#f1f5f9" stroke="#94a3b8" class="box"/>
  <text x="230" y="512" text-anchor="middle" class="label">Mode 1  Manual (dev)</text>
  <text x="230" y="532" text-anchor="middle" class="small">Docker + producer + processor in separate terminals</text>
  <text x="230" y="552" text-anchor="middle" class="small">Hours 15 learning path</text>

  <rect x="440" y="490" width="320" height="80" fill="#fdf4ff" stroke="#d946ef" class="box"/>
  <text x="600" y="512" text-anchor="middle" class="label">Mode 2  Dagster (production)</text>
  <text x="600" y="532" text-anchor="middle" class="small">check_infra ’ produce ’ process ’ DQ ’ Snowflake</text>
  <text x="600" y="552" text-anchor="middle" class="small">One-click Materialize all</text>

  <rect x="810" y="490" width="320" height="80" fill="#f8fafc" stroke="#64748b" class="box"/>
  <text x="970" y="512" text-anchor="middle" class="label">Mode 3  Operational tools</text>
  <text x="970" y="532" text-anchor="middle" class="small">Dashboard · reconciliation · integration test</text>
  <text x="970" y="552" text-anchor="middle" class="small">Run on-demand by engineers</text>

  <text x="600" y="620" text-anchor="middle" class="small">Source: diagrams/architecture.mermaid · 25 tickers · exactly-once via checkpoints + Delta ACID</text>
  <text x="600" y="642" text-anchor="middle" class="small">github.com/JanviChitroda24/kafka-spark-streaming-pipeline</text>
</svg>
